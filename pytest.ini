[pytest]
; Configuração do pytest para os testes do plugin Divisão Balanceada de Áreas.
; Os testes de lógica pura (sem QGIS) rodam em qualquer ambiente Python;
; os testes que dependem do QGIS usam pytest.importorskip("qgis") via
; fixture definida em balanced_work_areas/tests/conftest.py e são pulados
; automaticamente quando o módulo qgis não está disponível.
testpaths = balanced_work_areas/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
